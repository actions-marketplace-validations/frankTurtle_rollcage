name: piece-12-golden-path-template

on:
  push:
    branches: [main, develop]
    paths:
      [
        'pieces/12-golden-path-template/**',
        'shared/ts/**',
        '.github/workflows/piece-12-golden-path-template.yml',
      ]
  pull_request:
    paths:
      [
        'pieces/12-golden-path-template/**',
        'shared/ts/**',
        '.github/workflows/piece-12-golden-path-template.yml',
      ]

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the pipeline test: scaffold into a temp dir, then lint, typecheck, test and build
      # the generated sample service with the monorepo's node_modules linked in (no network).
      - run: pnpm --filter @adl/golden-path-template coverage
      - name: Demo runs offline end to end
        run: pnpm --filter @adl/golden-path-template demo
