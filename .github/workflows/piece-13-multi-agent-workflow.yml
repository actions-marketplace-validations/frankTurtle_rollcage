name: piece-13-multi-agent-workflow

on:
  push:
    branches: [main, develop]
    paths:
      [
        'pieces/13-multi-agent-workflow/**',
        '.claude/agents/**',
        'shared/ts/**',
        '.github/workflows/piece-13-multi-agent-workflow.yml',
      ]
  pull_request:
    paths:
      [
        'pieces/13-multi-agent-workflow/**',
        '.claude/agents/**',
        'shared/ts/**',
        '.github/workflows/piece-13-multi-agent-workflow.yml',
      ]

permissions:
  contents: read

jobs:
  test-eval-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adl/multi-agent-workflow coverage
      - name: Agent trajectory regression gate (Escapement eval harness)
        run: pnpm --filter @adl/multi-agent-workflow eval:gate
      - name: Demo runs offline end to end
        run: pnpm --filter @adl/multi-agent-workflow demo
