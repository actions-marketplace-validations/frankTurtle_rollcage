name: Provenance signing
description: Create build provenance for an artifact (attest) or block a deploy unless its attestation verifies (verify).
author: rollcage

inputs:
  artifact:
    description: Path to the artifact, relative to the workspace.
    required: true
  mode:
    description: >-
      verify (default) runs the deploy gate with gh attestation verify and fails the job on any
      doubt. attest creates build provenance with GitHub artifact attestations. attest needs the
      calling job to grant id-token write, attestations write and contents read, and it writes to
      the public Sigstore log on public repositories.
    default: verify
  repo:
    description: Repository the attestation must come from (verify mode).
    default: ${{ github.repository }}
  signer-workflow:
    description: Workflow path (OWNER/REPO/.github/workflows/file.yml) that must have signed (verify mode). Set it; without it any workflow in the repository can satisfy the gate.
    default: ''
  bundle:
    description: Path to an offline attestation bundle (verify mode). Empty fetches from GitHub.
    default: ''
  github-token:
    description: Token for gh in verify mode.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          verify|attest) ;;
          *) echo "mode must be verify or attest, got: $MODE" >&2; exit 2 ;;
        esac
    - name: Attest build provenance
      if: inputs.mode == 'attest'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ inputs.artifact }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.mode == 'verify'
      with:
        node-version: 24
    - name: Install dependencies
      if: inputs.mode == 'verify'
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: |
        corepack enable
        pnpm install --frozen-lockfile --filter "@adl/provenance-signing..."
    - name: Deploy gate
      if: inputs.mode == 'verify'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PROV_ARTIFACT: ${{ github.workspace }}/${{ inputs.artifact }}
        PROV_REPO: ${{ inputs.repo }}
        PROV_SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        PROV_BUNDLE: ${{ inputs.bundle }}
        PROV_REPORT: ${{ runner.temp }}/provenance-gate-report.json
      run: |
        args=(gate --mode github-attestation --repo "$PROV_REPO" --artifact "$PROV_ARTIFACT" --report "$PROV_REPORT")
        [ -n "$PROV_SIGNER_WORKFLOW" ] && args+=(--signer-workflow "$PROV_SIGNER_WORKFLOW")
        [ -n "$PROV_BUNDLE" ] && args+=(--bundle "$GITHUB_WORKSPACE/$PROV_BUNDLE")
        pnpm exec tsx src/bin.ts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
