[project]
name = "rag-onboarding"
version = "0.0.0"
description = "RAG onboarding agent: cited answers over a codebase and runbooks, refuses when the sources are silent."
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.0",   # vector store, and the optional ONNX MiniLM embedder
  "pydantic>=2.7",   # validate model output and config
  "pyyaml>=6",       # read rag.yml
]

[project.scripts]
rag-onboarding = "rag_onboarding.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5", "types-pyyaml"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_onboarding"

# Caches live under .venv so the repo's prettier and git never see them.
[tool.ruff]
cache-dir = ".venv/.ruff_cache"
line-length = 100
target-version = "py312"
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
cache_dir = ".venv/.mypy_cache"
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".venv/.pytest_cache"

[tool.coverage.run]
data_file = ".venv/.coverage"
source = ["rag_onboarding"]

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true
